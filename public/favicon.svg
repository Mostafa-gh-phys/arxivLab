<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="axl-bg" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#090E18" />
    </linearGradient>
    <linearGradient id="axl-blue" x1="152" y1="360" x2="360" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Minimal rounded square monoblock -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#axl-bg)" />
  <rect
    x="22"
    y="22"
    width="468"
    height="468"
    rx="110"
