<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="axl-bg" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#0D121C" />
    </linearGradient>
    <linearGradient id="axl-crimson" x1="-170" y1="-32" x2="-48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="axl-cobalt" x1="48" y1="-32" x2="170" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="axl-paper" x1="-170" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Outer GNOME/macOS squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#axl-bg)" />
  <rect x="18" y="18" width="476" height="476" rx="110" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4" />

  <!-- Centered precision Chi-prism & folded archive mark -->
  <g transform="translate(256 256)">
    <!-- Subtle scientific orbital ring -->
    <circle cx="0" cy="0" r="162" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="3" />

    <!-- Symmetric +45 deg axis: arXiv Crimson (top-left) & MCP Cobalt (bottom-right) -->
    <g transform="rotate(45)">
      <rect x="-172" y="-32" width="122" height="64" rx="16" fill="url(#axl-crimson)" />
      <rect x="50" y="-32" width="122" height="64" rx="16" fill="url(#axl-cobalt)" />
    </g>

    <!-- Main -45 deg folded manuscript ribbon -->
    <g transform="rotate(-45)">
      <!-- Ribbon body with chamfered paper corner at upper-right -->
      <path
        d="M-156 -32 H126 L172 14 V16 C172 24.837 164.837 32 156 32 H-156 C-164.837 32 -172 24.837 -172 16 V-16 C-172 -24.837 -164.837 -32 -156 -32 Z"
        fill="url(#axl-paper)"
      />
      <!-- Folded archival corner crease -->
      <path
        d="M126 -32 L172 14 H138 C131.373 14 126 8.627 126 2 V-32 Z"
        fill="#CBD5E1"
      />
      <!-- Subtle rule lines evoking scientific preprint sheet -->
      <rect x="-132" y="-7" width="84" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.45" />
      <rect x="-132" y="5" width="52" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.32" />
    </g>
  </g>
</svg>
