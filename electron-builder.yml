appId: org.arxivlab.workstation
productName: arXivLab
directories:
  output: release
files:
  - electron/**/*
  - package.json
extraResources:
  - from: dist
    to: dist
  - from: dist-electron
    to: dist-electron
  - from: mcp-stdio.ts
    to: mcp-stdio.ts
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Science;Education
  artifactName: "arXivLab-${version}-x86_64.AppImage"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "arXivLab-Setup-${version}.${ext}"
portable:
  artifactName: "arXivLab-Portable-${version}.${ext}"
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.education
