name: Build Desktop Installers (Linux AppImage & Windows EXE)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish installers to the GitHub Releases page'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'Release tag to create alongside previous releases (auto-bumps if existing release is immutable)'
        type: string
        required: false
        default: 'v1.1.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save electron electron-builder
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: arxivlab-linux-appimage
          path: release/*.AppImage

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save electron electron-builder
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: arxivlab-windows-exe
          path: release/*.exe

  publish-release:
    needs: [build-linux, build-windows]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: arxivlab-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh release-artifacts/

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_INPUT="$(echo "$TAG_INPUT" | xargs)"
            if [ -n "$CLEAN_INPUT" ]; then
              TAG="$CLEAN_INPUT"
            else
              PKG_VERSION="$(node -p "require('./package.json').version")"
              TAG="v${PKG_VERSION}"
            fi
          else
            TAG="$REF_NAME"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_IMMUTABLE="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false' 2>/dev/null || echo "false")"
            if [ "$IS_IMMUTABLE" = "true" ]; then
              if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                echo "Release $TAG already exists and is immutable. Push a new tag or run workflow_dispatch."
                exit 1
              fi
              if [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
                PREFIX="${BASH_REMATCH[1]}"
                N=$((BASH_REMATCH[2] + 1))
              else
                PREFIX="$TAG"
                N=1
              fi
              while gh release view "${PREFIX}.${N}" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG="${PREFIX}.${N}"
              echo "Existing release is immutable; creating new release tag: $TAG"
            fi
          fi

          echo "Publishing GitHub Release for tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release-artifacts/* \
              --target "$TARGET_SHA" \
              --title "arXivLab $TAG" \
              --generate-notes \
              --latest
          fi
