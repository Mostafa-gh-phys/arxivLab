name: Build Android App (APK & Google Play AAB)

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Attach Android APK & AAB to a GitHub Release'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'GitHub Release tag (e.g. v2.0-android or v2.0)'
        type: string
        required: false
        default: 'v2.0-android'
      upload_to_play_internal:
        description: 'Upload signed .aab directly to Google Play Internal Testing track (requires secrets)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: npm install --no-save @capacitor/cli @capacitor/android @capacitor/assets

      - name: Decode Android Upload Keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/arxivlab-release.jks
            echo "keystore_path=/tmp/arxivlab-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned AAB + debug APK."
          fi

      - name: Build Android APK & Google Play AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: arxivlab-android-bundle
          path: |
            release/*.apk
            release/*.aab

      - name: Upload to Google Play Internal Testing (optional)
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_to_play_internal == true &&
          steps.keystore.outputs.keystore_path != '' &&
          secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: org.arxivlab.workstation
          releaseFiles: release/*.aab
          track: internal
          status: completed

      - name: Publish Android Release on GitHub
        if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release != false))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-$REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk release/*.aab --clobber
          else
            gh release create "$TAG" release/*.apk release/*.aab \
              --target "$TARGET_SHA" \
              --title "arXivLab Android $TAG" \
              --generate-notes
          fi
