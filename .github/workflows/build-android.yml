name: Build Android App (APK & Google Play AAB)

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Attach Android APK & AAB to a GitHub Release'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'GitHub Release tag (e.g. v2.0-android or v2.0)'
        type: string
        required: false
        default: 'v2.0-android'
      upload_to_play_internal:
        description: 'Upload signed .aab directly to Google Play Internal Testing track (requires secrets)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: npm install --no-save @capacitor/cli @capacitor/android @capacitor/assets

      - name: Decode Android Upload Keystore & Play Credentials (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/arxivlab-release.jks
            echo "keystore_path=/tmp/arxivlab-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned AAB + debug APK."
          fi
          if [ -n "$PLAY_JSON" ]; then
            echo "has_play_sa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_sa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK & Google Play AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: arxivlab-android-bundle
          path: |
            release/*.apk
            release/*.aab

      - name: Upload to Google Play Internal Testing (optional)
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_to_play_internal == true &&
          steps.keystore.outputs.keystore_path != '' &&
          steps.keystore.outputs.has_play_sa == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: org.arxivlab.workstation
          releaseFiles: release/*.aab
          track: internal
          status: completed

      - name: Publish Android Release on GitHub
        if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release != false))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_INPUT="$(echo "$TAG_INPUT" | xargs)"
            TAG="${CLEAN_INPUT:-v2.0-android}"
          else
            TAG="$REF_NAME"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_IMMUTABLE="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false' 2>/dev/null || echo "false")"
            if [ "$IS_IMMUTABLE" = "true" ]; then
              if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                echo "Release $TAG already exists and is immutable. Push a new tag or run workflow_dispatch."
                exit 1
              fi
              N=2
              while gh release view "${TAG}.${N}" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG="${TAG}.${N}"
              echo "Existing release is immutable; creating new release tag: $TAG"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk release/*.aab --clobber
          else
            gh release create "$TAG" release/*.apk release/*.aab \
              --target "$TARGET_SHA" \
              --title "arXivLab Android $TAG" \
              --generate-notes
          fi
