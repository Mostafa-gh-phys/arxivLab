name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Publish Android .apk to GitHub Releases'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'GitHub Release tag for Android APK'
        type: string
        required: false
        default: 'v2.0-android'
      commit_apk_to_repo:
        description: 'Also save arXivLab-android.apk inside apk/ folder of repository'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @capacitor/cli @capacitor/android

      - name: Decode Android Keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/arxivlab-release.jks
            echo "keystore_path=/tmp/arxivlab-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "Building directly installable Android APK without release keystore."
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: arxivlab-android-apk
          path: release/*.apk

      - name: Commit APK to repository (optional)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.commit_apk_to_repo == true
        run: |
          mkdir -p apk
          cp -f release/*.apk apk/arXivLab-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/arXivLab-android.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Android APK binary"
            git push
          fi

      - name: Publish Android Release on GitHub
        if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release != false))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_INPUT="$(echo "$TAG_INPUT" | xargs)"
            TAG="${CLEAN_INPUT:-v2.0-android}"
          else
            TAG="$REF_NAME"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_IMMUTABLE="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.immutable // false' 2>/dev/null || echo "false")"
            if [ "$IS_IMMUTABLE" = "true" ]; then
              if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                echo "Release $TAG already exists and is immutable. Push a new tag or run workflow_dispatch."
                exit 1
              fi
              N=2
              while gh release view "${TAG}.${N}" >/dev/null 2>&1; do
                N=$((N + 1))
              done
              TAG="${TAG}.${N}"
              echo "Existing release is immutable; creating new release tag: $TAG"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.apk --clobber
          else
            gh release create "$TAG" release/*.apk \
              --target "$TARGET_SHA" \
              --title "arXivLab Android $TAG" \
              --generate-notes
          fi
